name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_artifacts:
        description: Build application and release artifacts
        type: boolean
        default: true
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      BUILD_ARTIFACTS: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.build_artifacts) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v, "Tag must match project version"'
      - name: Enable Linux source repositories
        if: runner.os == 'Linux' && env.BUILD_ARTIFACTS == 'true'
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          for path in Path('/etc/apt/sources.list.d').glob('*.sources'):
              text = path.read_text()
              path.write_text(text.replace('Types: deb\n', 'Types: deb deb-src\n'))
          for path in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list')]:
              if path.exists():
                  text = path.read_text()
                  extra = [line.replace('deb ', 'deb-src ', 1) for line in text.splitlines() if line.startswith('deb ')]
                  path.write_text(text + '\n' + '\n'.join(extra) + '\n')
          PY
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0 \
            libxcb-keysyms1 libxcb-shape0 libxcb-xkb1 libxcb-icccm4 libxkbcommon-x11-0
          if [ "$BUILD_ARTIFACTS" = 'true' ]; then
            sudo apt-get install -y xvfb xauth
          fi
      - name: Install application and build tools
        if: env.BUILD_ARTIFACTS == 'true'
        run: python -m pip install -e ".[test,build]"
      - name: Install application and test tools
        if: env.BUILD_ARTIFACTS != 'true'
        run: python -m pip install -e ".[test]"
      - name: Run automated tests (fake devices only)
        run: python -m pytest -q
      - name: Build and smoke-test packaged app
        id: desktop-build
        if: env.BUILD_ARTIFACTS == 'true'
        run: python packaging/build.py
      - name: Refresh Linux native providers and rebuild against available sources
        if: runner.os == 'Linux' && env.BUILD_ARTIFACTS == 'true'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          report = json.loads(next(Path('artifacts/builds').glob('*.inventory.json')).read_text())
          packages = sorted({c['name'] for c in report['components'] if c['provider'] == 'dpkg'})
          if packages:
              subprocess.run(['sudo', 'apt-get', 'install', '--only-upgrade', '-y', *packages], check=True)
          PY
          python packaging/build.py
      - name: Smoke-test Linux archive with X11 display plugin
        if: runner.os == 'Linux' && env.BUILD_ARTIFACTS == 'true'
        run: |
          smoke_dir=$(mktemp -d)
          trap 'rm -rf "$smoke_dir"' EXIT
          tar -xzf artifacts/builds/*_linux-*.tar.gz -C "$smoke_dir"
          timeout 30s xvfb-run -a env QT_QPA_PLATFORM=xcb "$smoke_dir/rigctl-launcher/rigctl-launcher/rigctl-launcher" --smoke-test
      - name: Collect matching dependency sources and build recipes
        if: env.BUILD_ARTIFACTS == 'true'
        run: python packaging/sources.py
      - uses: actions/upload-artifact@v7
        if: env.BUILD_ARTIFACTS == 'true'
        with:
          name: ${{ steps.desktop-build.outputs.artifact_name }}
          path: artifacts/builds/*
          if-no-files-found: error
  prepare-release:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.build_artifacts)
    needs: build
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: ${{ steps.public-files.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'packaging>=24,<27'
      - uses: actions/download-artifact@v8
        with:
          pattern: rigctl-launcher_*_*-*
          path: release-inputs
          merge-multiple: true
      - name: Assemble applications and one combined source ZIP
        id: public-files
        run: python packaging/release_assets.py release-inputs release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.public-files.outputs.artifact_name }}
          path: release-assets/*
          if-no-files-found: error
  draft-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: prepare-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare-release.outputs.artifact_name }}
          path: release-assets
      - name: Create draft prerelease for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' 'To run the app, download and extract the application archive matching your operating system and processor. The single _sources.zip download contains application/dependency sources, build instructions, inventories and provider patches for all platforms. checksums.txt verifies all four archives.' '' 'These preview builds are unsigned and require separately installed Hamlib rigctld. Fresh installations start with no radio profiles. Platform build success does not establish hardware support.' '' 'License texts and third-party notices are included in the application and available through Help → About / Licenses.' > release-notes.txt
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease --title "RigCtl-Launcher $RELEASE_TAG" --notes-file release-notes.txt
