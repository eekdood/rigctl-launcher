name: Test and build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-2022, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python -c 'import os,tomllib; v=tomllib.load(open("pyproject.toml","rb"))["project"]["version"]; assert os.environ["GITHUB_REF_NAME"] == "v"+v, "Tag must match project version"'
      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo python3 - <<'PY'
          from pathlib import Path
          for path in Path('/etc/apt/sources.list.d').glob('*.sources'):
              text = path.read_text()
              path.write_text(text.replace('Types: deb\n', 'Types: deb deb-src\n'))
          for path in [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.list')]:
              if path.exists():
                  text = path.read_text()
                  extra = [line.replace('deb ', 'deb-src ', 1) for line in text.splitlines() if line.startswith('deb ')]
                  path.write_text(text + '\n' + '\n'.join(extra) + '\n')
          PY
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0
      - name: Install application and build tools
        run: python -m pip install -e ".[test,build]"
      - name: Run automated tests (fake devices only)
        run: python -m pytest -q
      - name: Build and smoke-test packaged app
        run: python packaging/build.py
      - name: Refresh Linux native providers and rebuild against available sources
        if: runner.os == 'Linux'
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          report = json.loads(next(Path('artifacts/packages').glob('*.inventory.json')).read_text())
          packages = sorted({c['name'] for c in report['components'] if c['provider'] == 'dpkg'})
          if packages:
              subprocess.run(['sudo', 'apt-get', 'install', '--only-upgrade', '-y', *packages], check=True)
          PY
          python packaging/build.py
      - name: Collect matching dependency sources and build recipes
        run: python packaging/sources.py
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.os }}
          path: artifacts/packages/*
          if-no-files-found: error
  prepare-release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install 'packaging>=24,<27'
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: release-inputs
          merge-multiple: true
      - name: Assemble applications and one combined source ZIP
        run: python packaging/release_assets.py release-inputs release-assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: release-assets/*
          if-no-files-found: error
  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: prepare-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: release-assets
      - name: Create draft prerelease for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          printf '%s\n' 'To run the app, download and extract the application archive matching your operating system and processor. The single -sources.zip download contains application/dependency sources, build instructions, inventories and provider patches for all platforms. checksums.txt verifies all four archives.' '' 'These preview builds are unsigned and require separately installed Hamlib rigctld. Fresh installations start with no radio profiles. Platform build success does not establish hardware support.' '' 'License texts and third-party notices are included in the application and available through Help → About / Licenses.' > release-notes.txt
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --draft --prerelease --title "RigCtl-Launcher $RELEASE_TAG" --notes-file release-notes.txt
